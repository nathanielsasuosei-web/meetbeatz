name: album-fetch
# Temporary helper: pulls the artwork out of an Imgur album and commits it to
# this branch, because the agent sandbox cannot reach i.imgur.com and cannot
# download Actions artifacts either (those live on blob.core.windows.net).
# Both this workflow and the .asset-drop/ folder are deleted once the images
# have been picked up.
on:
  push:
    branches: ["arena/01a0fcc5-meetbeatz"]
    paths: [".github/workflows/album-fetch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch images from the album
        run: |
          mkdir -p .asset-drop
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for id in bRv8jZZ; do
            printf 'jpg  %s -> ' "$id"
            curl -sSL --retry 3 -A "$UA" -w '%{http_code} %{size_download} bytes\n' -o ".asset-drop/$id.jpg" "https://i.imgur.com/$id.jpg" || true
            printf 'webp %s -> ' "$id"
            curl -sSL --retry 3 -A "$UA" -w '%{http_code} %{size_download} bytes\n' -o ".asset-drop/$id.webp" "https://i.imgur.com/${id}_d.webp?maxwidth=2000&fidelity=grand" || true
          done
          ls -l .asset-drop
          for f in .asset-drop/*; do echo "$f -> $(file -b "$f")"; done
      - name: Commit
        run: |
          git config user.name "asset-fetch-bot"
          git config user.email "asset-fetch-bot@users.noreply.github.com"
          git add -A .asset-drop
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "temp: drop album OUQcO4N images"
          git push origin HEAD:arena/01a0fcc5-meetbeatz
